<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка увеличения текста</title><style>body{margin:0;font:16px Arial;background:#eee}header{padding:12px;display:flex;gap:16px;flex-wrap:wrap}select,button{font:inherit;min-height:40px}iframe{width:100%;height:calc(100vh - 80px);border:0}</style><header><label>Проект <select id="project"><option value="shiftnest">ShiftNest</option><option value="relayops">RelayOps</option></select></label><button id="text">Увеличить текст до 200%</button><span id="state" role="status">100%</span></header><iframe id="app" title="Проверяемый интерфейс" src="shiftnest/"></iframe><script>const frame=document.querySelector('#app');let large=false;document.querySelector('#text').onclick=()=>{large=!large;frame.contentDocument.documentElement.style.fontSize=large?'32px':'16px';document.querySelector('#state').textContent=large?'200%':'100%';document.querySelector('#text').textContent=large?'Вернуть текст 100%':'Увеличить текст до 200%'};document.querySelector('#project').onchange=e=>{large=false;document.querySelector('#state').textContent='100%';document.querySelector('#text').textContent='Увеличить текст до 200%';frame.src=e.target.value+'/'};</script></html>
